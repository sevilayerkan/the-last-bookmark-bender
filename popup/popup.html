<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Last Bookmark Bender</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">THE LAST</p>
        <h1>Bookmark Bender</h1>
      </div>
      <div class="header-actions">
        <button id="refreshButton" class="icon-button" aria-label="Refresh timers">↻</button>
        <button id="settingsButton" class="icon-button" aria-label="Open settings">⚙</button>
      </div>
    </header>

    <section id="onboardingNotice" class="notice hidden">
      <strong>Setup is not complete.</strong>
      <span>Choose your default retention time first.</span>
      <button id="openOnboardingButton">Finish setup</button>
    </section>

    <section class="save-card">
      <div id="currentPage" class="current-page">Loading current page…</div>
      <button id="saveButton" class="primary">Bend This Bookmark</button>
      <p id="feedback" class="feedback" role="status"></p>
    </section>

    <section class="toolbar">
      <input id="searchInput" type="search" placeholder="Search bookmarks" />
      <select id="sortSelect" aria-label="Sort bookmarks">
        <option value="expiration">Soonest first</option>
        <option value="newest">Newest first</option>
        <option value="title">Title</option>
      </select>
    </section>

    <section id="bookmarkList" class="bookmark-list"></section>

    <section id="deletedSection" class="deleted-section hidden">
      <div class="section-title">RECENTLY DELETED — <span id="deletedCount">0</span></div>
      <div id="deletedList" class="bookmark-list"></div>
    </section>
  </main>

  <div id="confirmDialog" class="confirm-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="confirm-card">
      <h2 id="confirmTitle">Delete bookmark?</h2>
      <p id="confirmMessage">This bookmark will move to Recently Deleted.</p>
      <div class="confirm-actions">
        <button id="confirmCancel" type="button">Cancel</button>
        <button id="confirmOk" type="button" class="danger">Delete</button>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
